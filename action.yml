name: 'AI Reviewer — Quality'
description: 'Deterministic, no API key needed. PR reviewer for code quality — SOLID, complexity, dead code, clones, naming, docs, missing tests. COMMENT-only, never blocks merge.'
author: 'sfg-labs'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token. Pass secrets.GITHUB_TOKEN from your workflow.'
    required: true
  config-path:
    description: 'Path to ai-review.yml config in the target repo (optional).'
    required: false
    default: '.github/ai-review.yml'
  max-tokens:
    description: 'Max input tokens per PR (skip with comment if exceeded).'
    required: false
    default: '50000'
  rule-pack-version:
    description: 'Rule pack semver (defaults to action package version).'
    required: false
    default: ''

outputs:
  verdict:
    description: 'Always COMMENT for the quality reviewer (never blocks merge).'
  finding-count:
    description: 'Total number of findings emitted (after suppression and dedupe).'

runs:
  using: 'node20'
  main: 'dist/index.js'
